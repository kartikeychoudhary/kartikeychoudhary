<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="313" viewBox="0 0 1000 313" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Terminal: a quick introduction</title>
  <desc id="desc">An animated terminal session. whoami: Kartikey Choudhary, senior software engineer, full stack end to end. Day job: Java, Spring Boot and Angular across hospitality, enterprise analytics and fintech tooling. After hours: paisa-trail, komorebi, tabbook, portside, txn-parser, minted, zenboard, catalogue, kairos. Principles: verifiable AI, software you can own, care across the stack.</desc>
