<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kairos — turn complex data into a readable view.</title>
  <desc id="desc">Animated illustration with placeholder data: a price line drawing itself over candlesticks, beside a factor matrix whose cells pulse.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .cd{opacity:0;animation:cd 8s infinite}
    @keyframes cd{0%{opacity:0;transform:translateY(6px)}4%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    .q1{animation-delay:.2s}.q2{animation-delay:.4s}.q3{animation-delay:.6s}.q4{animation-delay:.8s}.q5{animation-delay:1s}.q6{animation-delay:1.2s}.q7{animation-delay:1.4s}.q8{animation-delay:1.6s}.q9{animation-delay:1.8s}
    .m{animation:m 3.2s ease-in-out infinite}
    .m1{animation-delay:-.4s}.m2{animation-delay:-.9s}.m3{animation-delay:-1.5s}.m4{animation-delay:-2.1s}.m5{animation-delay:-2.7s}
    @keyframes m{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cd{opacity:1}}
  </style>
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0D20"/><stop offset="1" stop-color="#14122E"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="70" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C451" stop-opacity=".25"/><stop offset="1" stop-color="#F5C451" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="14" fill="url(#kbg)"/>
  <rect x=".5" y=".5" width="599" height="259" rx="13.5" stroke="#2A2A52"/>
  <text x="24" y="32" class="sans" fill="#F5C451" font-size="11" font-weight="700" letter-spacing="2">09 / RESEARCH TOOLS · DATA VISUALIZATION</text>

  <!-- chart -->
  <rect x="24" y="56" width="340" height="140" rx="12" fill="#0F1230" stroke="#25285A"/>
  <g stroke="#1C1F48"><path d="M36 92H352M36 124H352M36 156H352"/></g>
  <g stroke-width="1.5">
    <g class="cd"><path d="M58 150v26" stroke="#6EE7B7"/><rect x="53" y="154" width="10" height="16" fill="#6EE7B7"/></g>
    <g class="cd q1"><path d="M90 140v28" stroke="#6EE7B7"/><rect x="85" y="144" width="10" height="18" fill="#6EE7B7"/></g>
    <g class="cd q2"><path d="M122 132v26" stroke="#FB7185"/><rect x="117" y="138" width="10" height="12" fill="#FB7185"/></g>
    <g class="cd q3"><path d="M154 120v30" stroke="#6EE7B7"/><rect x="149" y="126" width="10" height="20" fill="#6EE7B7"/></g>
    <g class="cd q4"><path d="M186 106v28" stroke="#6EE7B7"/><rect x="181" y="112" width="10" height="16" fill="#6EE7B7"/></g>
    <g class="cd q5"><path d="M218 112v24" stroke="#FB7185"/><rect x="213" y="116" width="10" height="12" fill="#FB7185"/></g>
    <g class="cd q6"><path d="M250 94v30" stroke="#6EE7B7"/><rect x="245" y="100" width="10" height="18" fill="#6EE7B7"/></g>
    <g class="cd q7"><path d="M282 84v26" stroke="#6EE7B7"/><rect x="277" y="88" width="10" height="16" fill="#6EE7B7"/></g>
    <g class="cd q8"><path d="M314 88v24" stroke="#FB7185"/><rect x="309" y="92" width="10" height="12" fill="#FB7185"/></g>
    <g class="cd q9"><path d="M340 72v26" stroke="#6EE7B7"/><rect x="335" y="76" width="10" height="16" fill="#6EE7B7"/></g>
  </g>
  <path d="M40 166 58 160 90 152 122 146 154 134 186 120 218 122 250 108 282 96 314 98 340 84V196H40z" fill="url(#area)" opacity=".8"/>
  <path d="M40 166 58 160 90 152 122 146 154 134 186 120 218 122 250 108 282 96 314 98 340 84" stroke="#F5C451" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="340" stroke-dashoffset="340">
    <animate attributeName="stroke-dashoffset" values="340;0;0;340" keyTimes="0;.35;.92;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="36" y="76" class="mono" fill="#8C8FC2" font-size="9.5">PLACEHOLDER · NSE</text>

  <!-- factor matrix -->
  <text x="388" y="70" class="sans" fill="#8C8FC2" font-size="9.5" font-weight="700" letter-spacing="1.4">FACTOR MATRIX</text>
  <g class="mono" fill="#8C8FC2" font-size="9">
    <text x="388" y="96">QUAL</text><text x="388" y="122">VAL</text><text x="388" y="148">MOM</text><text x="388" y="174">RISK</text>
  </g>
  <g>
    <rect class="m" x="428" y="84" width="26" height="18" rx="4" fill="#F5C451"/><rect class="m m2" x="460" y="84" width="26" height="18" rx="4" fill="#6EE7B7"/><rect class="m m4" x="492" y="84" width="26" height="18" rx="4" fill="#F5C451"/><rect class="m m1" x="524" y="84" width="26" height="18" rx="4" fill="#6EE7B7"/>
    <rect class="m m3" x="428" y="110" width="26" height="18" rx="4" fill="#6EE7B7"/><rect class="m m5" x="460" y="110" width="26" height="18" rx="4" fill="#FB7185"/><rect class="m m1" x="492" y="110" width="26" height="18" rx="4" fill="#F5C451"/><rect class="m m2" x="524" y="110" width="26" height="18" rx="4" fill="#6EE7B7"/>
    <rect class="m m4" x="428" y="136" width="26" height="18" rx="4" fill="#F5C451"/><rect class="m" x="460" y="136" width="26" height="18" rx="4" fill="#6EE7B7"/><rect class="m m3" x="492" y="136" width="26" height="18" rx="4" fill="#6EE7B7"/><rect class="m m5" x="524" y="136" width="26" height="18" rx="4" fill="#FB7185"/>
    <rect class="m m2" x="428" y="162" width="26" height="18" rx="4" fill="#FB7185"/><rect class="m m1" x="460" y="162" width="26" height="18" rx="4" fill="#F5C451"/><rect class="m m4" x="492" y="162" width="26" height="18" rx="4" fill="#6EE7B7"/><rect class="m m3" x="524" y="162" width="26" height="18" rx="4" fill="#F5C451"/>
  </g>
  <rect x="424" y="80" width="130" height="104" rx="6" stroke="#F5C451" stroke-opacity=".0">
    <animate attributeName="stroke-opacity" values="0;.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="238" class="sans" fill="#F2F0FF" font-size="19" font-weight="600">Turn complex data into a readable view.</text>
</svg>
