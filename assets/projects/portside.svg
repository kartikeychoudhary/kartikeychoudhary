<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Portside — build, preview, publish, roll back.</title>
  <desc id="desc">Animated illustration: a release travels through source, build, preflight and publish stages, then fans out to a home server, Cloudflare Pages and GitHub Pages, under a sweeping lighthouse beam.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .k1{animation:k1 8s infinite}.k2{animation:k2 8s infinite}.k3{animation:k3 8s infinite}.k4{animation:k4 8s infinite}
    @keyframes k1{0%,4%{stroke:#334064}8%,94%{stroke:#22D3EE}100%{stroke:#334064}}
    @keyframes k2{0%,20%{stroke:#334064}24%,94%{stroke:#22D3EE}100%{stroke:#334064}}
    @keyframes k3{0%,36%{stroke:#334064}40%,94%{stroke:#22D3EE}100%{stroke:#334064}}
    @keyframes k4{0%,52%{stroke:#334064}56%,94%{stroke:#34D399}100%{stroke:#334064}}
    .c1{animation:c1 8s infinite}.c2{animation:c2 8s infinite}.c3{animation:c3 8s infinite}.c4{animation:c4 8s infinite}
    @keyframes c1{0%,6%{opacity:0}9%,94%{opacity:1}100%{opacity:0}}
    @keyframes c2{0%,22%{opacity:0}25%,94%{opacity:1}100%{opacity:0}}
    @keyframes c3{0%,38%{opacity:0}41%,94%{opacity:1}100%{opacity:0}}
    @keyframes c4{0%,54%{opacity:0}57%,94%{opacity:1}100%{opacity:0}}
    .t{opacity:.35;animation:t 8s infinite}
    @keyframes t{0%,62%{opacity:.35}68%,94%{opacity:1}100%{opacity:.35}}
    .live{animation:live 1.6s ease-in-out infinite}
    @keyframes live{50%{opacity:.4}}
    .beam{animation:beam 6s ease-in-out infinite alternate;transform-origin:566px 18px}
    @keyframes beam{from{transform:rotate(18deg)}to{transform:rotate(62deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.t{opacity:1}}
  </style>
  <defs>
    <linearGradient id="pbg2" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080E1E"/><stop offset="1" stop-color="#111433"/>
    </linearGradient>
    <linearGradient id="lb" x1="566" y1="18" x2="300" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pc"><rect width="600" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#pc)">
    <rect width="600" height="260" fill="url(#pbg2)"/>
    <path class="beam" d="M566 18 260 -40 260 90z" fill="url(#lb)"/>
    <g stroke="#1A2142"><path d="M0 214c40-6 80 6 120 0s80-6 120 0 80 6 120 0 80-6 120 0 80 6 120 0" /></g>
    <circle cx="566" cy="18" r="5" fill="#E9E3FF"/>
  </g>
  <rect x=".5" y=".5" width="599" height="259" rx="13.5" stroke="#262E57"/>
  <text x="24" y="32" class="sans" fill="#22D3EE" font-size="11" font-weight="700" letter-spacing="2">04 / DEVOPS · ANGULAR · NODE · SQLITE · DOCKER</text>

  <!-- pipeline -->
  <path d="M70 96H508" stroke="#263056" stroke-width="2"/>
  <circle r="6" fill="#22D3EE">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.06;.56;1" calcMode="linear" path="M70 96H508"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.56;.6;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g class="sans" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <circle class="k1" cx="70" cy="96" r="20" fill="#0E1530" stroke="#334064" stroke-width="2"/>
    <circle class="k2" cx="216" cy="96" r="20" fill="#0E1530" stroke="#334064" stroke-width="2"/>
    <circle class="k3" cx="362" cy="96" r="20" fill="#0E1530" stroke="#334064" stroke-width="2"/>
    <circle class="k4" cx="508" cy="96" r="20" fill="#0E1530" stroke="#334064" stroke-width="2"/>
    <text x="70" y="134" fill="#AFB8DA">SOURCE</text>
    <text x="216" y="134" fill="#AFB8DA">BUILD</text>
    <text x="362" y="134" fill="#AFB8DA">PREFLIGHT</text>
    <text x="508" y="134" fill="#AFB8DA">PUBLISH</text>
  </g>
  <g class="mono" font-size="9" fill="#6F7AA6" text-anchor="middle">
    <text x="70" y="148">zip · git</text><text x="216" y="148">isolated docker</text><text x="362" y="148">checks · logs</text>
  </g>
  <g stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path class="c1" d="M62 96l6 6 11-12" stroke="#22D3EE"/>
    <path class="c2" d="M208 96l6 6 11-12" stroke="#22D3EE"/>
    <path class="c3" d="M354 96l6 6 11-12" stroke="#22D3EE"/>
    <path class="c4" d="M500 96l6 6 11-12" stroke="#34D399"/>
  </g>
  <g class="live">
    <rect x="532" y="62" width="40" height="16" rx="8" fill="#0E3B2E" stroke="#34D399"/>
    <text x="552" y="74" text-anchor="middle" class="sans" fill="#34D399" font-size="9" font-weight="700" letter-spacing=".8">LIVE</text>
  </g>

  <!-- targets -->
  <g stroke="#263056" stroke-width="1.5"><path d="M508 150c0 18-64 16-64 32M508 150v32M508 150c0 18 64 16 64 32"/></g>
  <g class="sans" font-size="10" font-weight="600" text-anchor="middle">
    <g class="t"><rect x="418" y="182" width="52" height="22" rx="11" fill="#141C3D" stroke="#A78BFA"/><text x="444" y="197" fill="#D6CCFF">server</text></g>
    <g class="t"><rect x="474" y="182" width="68" height="22" rx="11" fill="#141C3D" stroke="#F6A53B"/><text x="508" y="197" fill="#FFD9A8">Cloudflare</text></g>
    <g class="t"><rect x="547" y="182" width="50" height="22" rx="11" fill="#141C3D" stroke="#AFB8DA"/><text x="572" y="197" fill="#E6EAF5">GitHub</text></g>
  </g>
  <!-- rollback -->
  <path d="M496 78C470 44 262 44 230 78" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 5">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M226 68l4 10 9-5" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="362" y="69" text-anchor="middle" class="mono" fill="#A78BFA" font-size="10">↩ rollback any release</text>

  <text x="24" y="238" class="sans" fill="#EEF1FF" font-size="19" font-weight="600">Build. Preview. Publish. Roll back.</text>
</svg>
