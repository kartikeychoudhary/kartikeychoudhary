<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kartikey Choudhary — Full-stack engineer</title>
  <desc id="desc">From database rows to the last pixel. Full-stack engineering, Android, applied AI, and self-hosted software. Project planets orbit a glowing core.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .tw{animation:tw 4s ease-in-out infinite}
    .tw2{animation-delay:-1.3s}.tw3{animation-delay:-2.6s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
    .au1{animation:au1 16s ease-in-out infinite alternate}
    .au2{animation:au2 21s ease-in-out infinite alternate}
    .au3{animation:au3 13s ease-in-out infinite alternate}
    @keyframes au1{from{transform:translate(0,0)}to{transform:translate(120px,30px)}}
    @keyframes au2{from{transform:translate(0,0)}to{transform:translate(-140px,-20px)}}
    @keyframes au3{from{transform:translate(0,0)}to{transform:translate(60px,-40px)}}
    .w{opacity:0;animation:cyc 15s infinite}
    .w2{animation-delay:3s}.w3{animation-delay:6s}.w4{animation-delay:9s}.w5{animation-delay:12s}
    @keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,17%{opacity:1;transform:translateY(0)}20%,100%{opacity:0;transform:translateY(-10px)}}
    .live{animation:live 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes live{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
    .core{animation:core 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes core{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(860px)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.w1{opacity:1}}
  </style>
  <defs>
    <clipPath id="frame"><rect width="1000" height="380" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/><stop offset=".55" stop-color="#0D1428"/><stop offset="1" stop-color="#140F26"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="ink" x1="40" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/><stop offset=".35" stop-color="#A78BFA"/><stop offset=".7" stop-color="#FF8A5B"/><stop offset="1" stop-color="#5EEAD4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-520 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="coreFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(788 176) scale(46)">
      <stop stop-color="#FFF7E6"/><stop offset=".45" stop-color="#FFC27A"/><stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2A3352"/></pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="380" fill="url(#bg)"/>
    <!-- aurora -->
    <g filter="url(#blur)" opacity=".55">
      <ellipse class="au1" cx="230" cy="40" rx="260" ry="70" fill="#14B8A6"/>
      <ellipse class="au2" cx="820" cy="70" rx="230" ry="80" fill="#7C3AED"/>
      <ellipse class="au3" cx="620" cy="360" rx="260" ry="70" fill="#FF7A45" opacity=".7"/>
    </g>
    <rect x="600" y="0" width="400" height="380" fill="url(#dots)" opacity=".55"/>
    <!-- stars -->
    <g fill="#E8ECFF">
      <circle class="tw" cx="96" cy="292" r="1.2"/><circle class="tw tw2" cx="540" cy="40" r="1.4"/>
      <circle class="tw tw3" cx="612" cy="300" r="1.1"/><circle class="tw" cx="960" cy="40" r="1.5"/>
      <circle class="tw tw2" cx="660" cy="96" r="1"/><circle class="tw tw3" cx="944" cy="250" r="1.2"/>
      <circle class="tw" cx="470" cy="270" r="1"/><circle class="tw tw3" cx="700" cy="330" r="1.3"/>
      <circle class="tw tw2" cx="380" cy="30" r="1"/>
    </g>

    <!-- left: identity -->
    <circle cx="48" cy="44" r="4" fill="#34D399"/>
    <circle class="live" cx="48" cy="44" r="4" fill="#34D399"/>
    <text x="62" y="49" class="sans" fill="#C8CFE6" font-size="13.5" font-weight="700" letter-spacing="2.2">KARTIKEY CHOUDHARY · SENIOR SOFTWARE ENGINEER</text>

    <text x="40" y="134" class="serif" fill="#F4F2EA" font-size="56" letter-spacing="-1.6">From database rows</text>
    <text x="40" y="200" class="serif" fill="url(#ink)" font-size="56" letter-spacing="-1.6" font-style="italic">to the last pixel.</text>

    <text x="42" y="250" class="mono" fill="#7C86A8" font-size="15">$ currently shipping</text>
    <g class="mono" font-size="15" font-weight="600">
      <text class="w w1" x="226" y="250" fill="#5EEAD4">Android apps in Kotlin</text>
      <text class="w w2" x="226" y="250" fill="#A78BFA">Spring Boot APIs</text>
      <text class="w w3" x="226" y="250" fill="#FF8A5B">Angular &amp; React interfaces</text>
      <text class="w w4" x="226" y="250" fill="#FF6B9A">small language models</text>
      <text class="w w5" x="226" y="250" fill="#FBBF24">self-hosted tools</text>
    </g>

    <!-- right: orbiting projects -->
    <g transform="translate(788 176)">
      <g stroke="#3B4670" stroke-width="1" stroke-dasharray="2 6">
        <ellipse rx="92" ry="34"/>
        <ellipse rx="140" ry="54"/>
        <ellipse rx="170" ry="70"/>
      </g>
      <circle r="44" fill="url(#coreFill)" class="core"/>
      <circle r="17" fill="#FFF3DC"/>
      <text y="5" text-anchor="middle" class="mono" fill="#2A1A10" font-size="13" font-weight="700">&lt;/&gt;</text>
      <g transform="rotate(-8)">
        <circle r="26" stroke="#FFC27A" stroke-opacity=".5" stroke-dasharray="3 5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g class="mono" font-size="10.5" font-weight="600">
        <g><circle r="7" fill="#2DD4BF"/><circle r="7" fill="#2DD4BF" filter="url(#glow)"/><text x="11" y="4" fill="#5EEAD4">paisa-trail</text>
          <animateMotion dur="12s" repeatCount="indefinite" path="M-92 0a92 34 0 1 0 184 0a92 34 0 1 0-184 0"/></g>
        <g><circle r="6" fill="#FF8A5B"/><circle r="6" fill="#FF8A5B" filter="url(#glow)"/><text x="10" y="4" fill="#FFB38F">komorebi</text>
          <animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M-92 0a92 34 0 1 0 184 0a92 34 0 1 0-184 0"/></g>
        <g><circle r="6" fill="#A999ED"/><circle r="6" fill="#A999ED" filter="url(#glow)"/><text x="10" y="4" fill="#C9BEFF">tabbook</text>
          <animateMotion dur="19s" repeatCount="indefinite" path="M140 0a140 54 0 1 1-280 0a140 54 0 1 1 280 0"/></g>
        <g><circle r="6" fill="#22D3EE"/><circle r="6" fill="#22D3EE" filter="url(#glow)"/><text x="10" y="4" fill="#7FE7F7">portside</text>
          <animateMotion dur="19s" begin="-9.5s" repeatCount="indefinite" path="M140 0a140 54 0 1 1-280 0a140 54 0 1 1 280 0"/></g>
        <g><circle r="5" fill="#FF6B9A"/><text x="9" y="4" fill="#FF9DBC">txn-parser</text>
          <animateMotion dur="27s" repeatCount="indefinite" path="M-170 0a170 70 0 1 0 340 0a170 70 0 1 0-340 0"/></g>
        <g><circle r="5" fill="#D4ED83"/><text x="9" y="4" fill="#D4ED83">minted</text>
          <animateMotion dur="27s" begin="-9s" repeatCount="indefinite" path="M-170 0a170 70 0 1 0 340 0a170 70 0 1 0-340 0"/></g>
        <g><circle r="5" fill="#F5C451"/><text x="9" y="4" fill="#F5C451">kairos</text>
          <animateMotion dur="27s" begin="-18s" repeatCount="indefinite" path="M-170 0a170 70 0 1 0 340 0a170 70 0 1 0-340 0"/></g>
      </g>
    </g>

    <!-- bottom rail -->
    <path d="M40 300H960" stroke="#232C4A"/>
    <rect class="scan" x="40" y="299" width="60" height="2" fill="#5EEAD4" opacity=".9"/>
    <text x="40" y="336" xml:space="preserve" class="sans" fill="#9AA3C2" font-size="12.5" font-weight="700" letter-spacing="1.8">INTERFACES<tspan fill="#3B4670">  ·  </tspan>SERVICES<tspan fill="#3B4670">  ·  </tspan>DATA<tspan fill="#3B4670">  ·  </tspan>ANDROID<tspan fill="#3B4670">  ·  </tspan>APPLIED AI<tspan fill="#3B4670">  ·  </tspan>SELF-HOSTED</text>
    <text x="960" y="336" text-anchor="end" class="mono" fill="#5EEAD4" font-size="13">kartikeychoudhary.com<tspan class="caret">_</tspan></text>
  </g>
  <rect x=".5" y=".5" width="999" height="379" rx="17.5" stroke="#26304F"/>
</svg>
