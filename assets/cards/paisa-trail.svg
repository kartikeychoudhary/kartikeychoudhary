<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Paisa Trail — every rupee, straight from your bank SMS.</title>
  <desc id="desc">Animated illustration: bank SMS messages arrive on a phone, pass through a rule engine and an encrypted vault, and become categorised ledger rows with a budget filling up.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .s1{animation:s1 10s infinite}.s2{animation:s2 10s infinite}.s3{animation:s3 10s infinite}
    .r1{animation:r1 10s infinite}.r2{animation:r2 10s infinite}.r3{animation:r3 10s infinite}
    @keyframes s1{0%,4%{opacity:0;transform:translateY(12px)}9%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
    @keyframes s2{0%,28%{opacity:0;transform:translateY(12px)}33%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
    @keyframes s3{0%,52%{opacity:0;transform:translateY(12px)}57%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
    @keyframes r1{0%,18%{opacity:0;transform:translateX(-14px)}23%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
    @keyframes r2{0%,42%{opacity:0;transform:translateX(-14px)}47%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
    @keyframes r3{0%,66%{opacity:0;transform:translateX(-14px)}71%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0}}
    .alert{opacity:0;animation:alert 10s infinite}
    @keyframes alert{0%,36%{opacity:0}40%,44%,52%,60%{opacity:1}48%,56%{opacity:.35}92%{opacity:1}97%,100%{opacity:0}}
    .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
    .glint{animation:glint 6s ease-in-out infinite}
    @keyframes glint{0%,100%{opacity:.25}50%{opacity:.6}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#031B1B"/><stop offset=".6" stop-color="#062A29"/><stop offset="1" stop-color="#0B302B"/>
    </linearGradient>
    <radialGradient id="psun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 20) scale(320 200)">
      <stop stop-color="#FFB547" stop-opacity=".28"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pgrid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#0E3B38" stroke-width="1"/></pattern>
    <clipPath id="screen"><rect x="52" y="122" width="156" height="194" rx="10"/></clipPath>
  </defs>
  <rect width="1000" height="340" rx="16" fill="url(#pbg)"/>
  <rect width="1000" height="340" rx="16" fill="url(#pgrid)" opacity=".6"/>
  <rect class="glint" width="1000" height="340" rx="16" fill="url(#psun)"/>
  <rect x=".5" y=".5" width="999" height="339" rx="15.5" stroke="#145A55"/>

  <text x="32" y="38" class="sans" fill="#FFB547" font-size="11.5" font-weight="700" letter-spacing="2.2">01 / FLAGSHIP · ANDROID · KOTLIN · JETPACK COMPOSE</text>
  <text x="32" y="76" class="sans" fill="#ECF7F3" font-size="26" font-weight="600">Every rupee, straight from your bank SMS.</text>
  <text x="968" y="76" text-anchor="end" class="sans" fill="#7FBDB4" font-size="14">No bank login. No server. No tracking.</text>

  <!-- phone -->
  <rect x="40" y="104" width="180" height="224" rx="24" fill="#0A1F1E" stroke="#2E6E66" stroke-width="2"/>
  <rect x="106" y="111" width="48" height="6" rx="3" fill="#1D4743"/>
  <g clip-path="url(#screen)">
    <rect x="52" y="122" width="156" height="194" fill="#0E2B29"/>
    <g class="s1">
      <rect x="60" y="134" width="140" height="44" rx="10" fill="#14403C"/>
      <text x="70" y="152" class="mono" fill="#9FE7DC" font-size="9.5" font-weight="700">HDFC BANK</text>
      <text x="70" y="167" class="mono" fill="#D8EEE9" font-size="9">Rs 450 debited · SWIGGY</text>
    </g>
    <g class="s2">
      <rect x="60" y="186" width="140" height="44" rx="10" fill="#14403C"/>
      <text x="70" y="204" class="mono" fill="#9FE7DC" font-size="9.5" font-weight="700">SBI CARD XX88</text>
      <text x="70" y="219" class="mono" fill="#D8EEE9" font-size="9">Rs 1,299 spent · AMAZON</text>
    </g>
    <g class="s3">
      <rect x="60" y="238" width="140" height="44" rx="10" fill="#14403C"/>
      <text x="70" y="256" class="mono" fill="#9FE7DC" font-size="9.5" font-weight="700">ICICI A/C XX12</text>
      <text x="70" y="271" class="mono" fill="#D8EEE9" font-size="9">Rs 2,400 credited · REFUND</text>
    </g>
  </g>

  <!-- pipeline -->
  <path id="pin" d="M224 222C290 222 300 214 352 214" stroke="#1E5C56" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M488 214C520 214 532 222 556 222" stroke="#1E5C56" stroke-width="2" stroke-dasharray="4 6"/>
  <g fill="#FFB547">
    <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M224 222C290 222 300 214 352 214"/></circle>
    <circle r="3.5" opacity=".6"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" path="M224 222C290 222 300 214 352 214"/></circle>
  </g>
  <g fill="#2DD4BF">
    <circle r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite" path="M488 214C520 214 532 222 556 222"/></circle>
  </g>
  <text x="252" y="196" class="mono" fill="#6FA9A0" font-size="10">your senders only</text>

  <!-- vault -->
  <circle class="ring" cx="420" cy="214" r="46" stroke="#2DD4BF" stroke-width="1.5"/>
  <circle cx="420" cy="214" r="46" fill="#0B2E2C" stroke="#2DD4BF" stroke-width="1.5"/>
  <path d="M420 184l24 9v17c0 15-10 26-24 31-14-5-24-16-24-31v-17z" fill="#11403B" stroke="#5EEAD4" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="409" y="211" width="22" height="16" rx="3" fill="#FFB547"/>
  <path d="M413 211v-5a7 7 0 0 1 14 0v5" stroke="#FFB547" stroke-width="2.2"/>
  <g transform="translate(420 214)">
    <circle r="58" stroke="#FFB547" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="1 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="420" y="296" text-anchor="middle" class="mono" fill="#9FE7DC" font-size="10.5">rules · dedupe · mask</text>
  <text x="420" y="314" text-anchor="middle" class="mono" fill="#6FA9A0" font-size="10">SQLCipher · Android Keystore</text>

  <!-- ledger -->
  <rect x="560" y="104" width="408" height="210" rx="14" fill="#08211F" stroke="#1E5C56"/>
  <text x="580" y="130" class="sans" fill="#7FBDB4" font-size="10.5" font-weight="700" letter-spacing="1.6">LEDGER · THIS MONTH</text>
  <text x="948" y="130" text-anchor="end" class="sans" fill="#ECF7F3" font-size="12" font-weight="600">on-device</text>
  <path d="M580 140H948" stroke="#16443F"/>
  <g class="r1">
    <circle cx="588" cy="162" r="5" fill="#FFB547"/>
    <text x="602" y="166" class="sans" fill="#ECF7F3" font-size="13" font-weight="600">Swiggy</text>
    <text x="676" y="166" class="sans" fill="#7FBDB4" font-size="11">Food</text>
    <text x="948" y="166" text-anchor="end" class="mono" fill="#FF8A7A" font-size="13">− ₹450</text>
  </g>
  <g class="r2">
    <circle cx="588" cy="190" r="5" fill="#A78BFA"/>
    <text x="602" y="194" class="sans" fill="#ECF7F3" font-size="13" font-weight="600">Amazon</text>
    <text x="676" y="194" class="sans" fill="#7FBDB4" font-size="11">Shopping</text>
    <text x="948" y="194" text-anchor="end" class="mono" fill="#FF8A7A" font-size="13">− ₹1,299</text>
  </g>
  <g class="r3">
    <circle cx="588" cy="218" r="5" fill="#2DD4BF"/>
    <text x="602" y="222" class="sans" fill="#ECF7F3" font-size="13" font-weight="600">Refund</text>
    <text x="676" y="222" class="sans" fill="#7FBDB4" font-size="11">Money in</text>
    <text x="948" y="222" text-anchor="end" class="mono" fill="#5EEAD4" font-size="13">+ ₹2,400</text>
  </g>
  <path d="M580 238H948" stroke="#16443F"/>
  <text x="580" y="262" class="sans" fill="#7FBDB4" font-size="10.5" font-weight="700" letter-spacing="1.4">FOOD BUDGET</text>
  <g class="alert">
    <rect x="852" y="250" width="96" height="18" rx="9" fill="#3A2A0E" stroke="#FFB547"/>
    <text x="900" y="263" text-anchor="middle" class="sans" fill="#FFB547" font-size="10" font-weight="700" letter-spacing=".6">80% ALERT</text>
  </g>
  <rect x="580" y="278" width="368" height="10" rx="5" fill="#123A36"/>
  <rect x="580" y="278" width="0" height="10" rx="5" fill="#FFB547">
    <animate attributeName="width" values="0;0;250;302;302;0" keyTimes="0;.2;.32;.4;.95;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <path d="M874 274v18" stroke="#ECF7F3" stroke-opacity=".5" stroke-dasharray="2 2"/>
  <text x="580" y="304" class="mono" fill="#6FA9A0" font-size="10">budgets · splits · Splitwise · ECB rates</text>
</svg>
