<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Minted — make room for a clearer money picture.</title>
  <desc id="desc">Animated illustration: an income and spending donut drawing itself, account, budget and spending bars filling, and a spinning coin.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .coin{animation:spin 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
    .float{animation:float 4s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12221E"/><stop offset="1" stop-color="#1A2D24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" rx="14" fill="url(#mbg)"/>
  <rect x=".5" y=".5" width="599" height="259" rx="13.5" stroke="#354B40"/>
  <text x="24" y="32" class="sans" fill="#D4ED83" font-size="11" font-weight="700" letter-spacing="2">06 / PERSONAL FINANCE · ANGULAR · SPRING BOOT · MYSQL</text>

  <g transform="translate(110 122)">
    <circle r="56" stroke="#2C4438" stroke-width="20"/>
    <circle r="56" stroke="#D4ED83" stroke-width="20" stroke-dasharray="0 352" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="0 352;226 352;226 352;0 352" keyTimes="0;.3;.92;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="56" stroke="#E5AD87" stroke-width="20" stroke-dasharray="0 352" transform="rotate(145)">
      <animate attributeName="stroke-dasharray" values="0 352;0 352;96 352;96 352;0 352" keyTimes="0;.3;.5;.92;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text y="-2" text-anchor="middle" class="sans" fill="#F0F3E7" font-size="10" font-weight="700" letter-spacing="1">IN / OUT</text>
    <text y="14" text-anchor="middle" class="mono" fill="#A8CDA4" font-size="10">this month</text>
  </g>

  <g class="sans" fill="#B8C8C0" font-size="10" font-weight="700" letter-spacing="1.2">
    <text x="210" y="74">ACCOUNTS</text><text x="210" y="114">BUDGETS</text><text x="210" y="154">SPENDING</text>
  </g>
  <g fill="#2C4438"><rect x="210" y="82" width="290" height="10" rx="5"/><rect x="210" y="122" width="290" height="10" rx="5"/><rect x="210" y="162" width="290" height="10" rx="5"/></g>
  <rect x="210" y="82" width="0" height="10" rx="5" fill="#A8CDA4"><animate attributeName="width" values="0;276;276;0" keyTimes="0;.25;.92;1" dur="6s" repeatCount="indefinite"/></rect>
  <rect x="210" y="122" width="0" height="10" rx="5" fill="#D4ED83"><animate attributeName="width" values="0;0;204;204;0" keyTimes="0;.1;.38;.92;1" dur="6s" repeatCount="indefinite"/></rect>
  <rect x="210" y="162" width="0" height="10" rx="5" fill="#E5AD87"><animate attributeName="width" values="0;0;238;238;0" keyTimes="0;.2;.5;.92;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="210" y="196" class="mono" fill="#7E998B" font-size="10">statement import · docker · analytics</text>

  <g class="float">
    <g class="coin">
      <circle cx="548" cy="118" r="22" fill="#D4ED83"/>
      <circle cx="548" cy="118" r="16" stroke="#6E8A2E" stroke-width="2"/>
      <text x="548" y="124" text-anchor="middle" class="sans" fill="#3E5418" font-size="16" font-weight="800">₹</text>
    </g>
  </g>

  <text x="24" y="238" class="sans" fill="#F0F3E7" font-size="19" font-weight="600">Make room for a clearer money picture.</text>
</svg>
