<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Angular Catalogue — three visual languages, one framework.</title>
  <desc id="desc">Animated illustration: the same button rendered in Swiss editorial, neo-brutalist and glassmorphic styles, each with its own motion.</desc>
  <style>
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .press{animation:press 2.4s ease-in-out infinite}
    @keyframes press{0%,40%,100%{transform:translate(0,0)}50%,70%{transform:translate(5px,5px)}}
    .blob{animation:blob 7s ease-in-out infinite alternate}
    .blob2{animation-duration:9s;animation-direction:alternate-reverse}
    @keyframes blob{from{transform:translate(0,0)}to{transform:translate(70px,40px)}}
    .rule{animation:rule 4s ease-in-out infinite}
    @keyframes rule{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="g3"><rect x="408" y="56" width="168" height="140" rx="16"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="600" height="260" rx="14" fill="#F3EFE6"/>
  <rect x=".5" y=".5" width="599" height="259" rx="13.5" stroke="#D8D0BF"/>
  <text x="24" y="32" class="sans" fill="#E63B2E" font-size="11" font-weight="700" letter-spacing="2">08 / UI SYSTEMS · ANGULAR · CSS</text>

  <!-- Swiss -->
  <rect x="24" y="56" width="168" height="140" fill="#FFFFFF" stroke="#1A1A1A"/>
  <g stroke="#ECE7DC"><path d="M66 56v140M108 56v140M150 56v140"/></g>
  <rect x="24" y="56" width="168" height="10" fill="#E63B2E"/>
  <text x="34" y="128" class="sans" fill="#1A1A1A" font-size="56" font-weight="700" letter-spacing="-3">Aa</text>
  <rect class="rule" x="36" y="142" width="140" height="3" fill="#E63B2E" style="transform-origin:36px 143px"/>
  <rect x="36" y="160" width="74" height="24" fill="#1A1A1A"/>
  <text x="73" y="176" text-anchor="middle" class="sans" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1.4">BUTTON</text>
  <text x="182" y="186" text-anchor="end" class="mono" fill="#9A9488" font-size="9">swiss</text>

  <!-- Brutalist -->
  <rect x="226" y="66" width="168" height="140" fill="#1A1A1A"/>
  <rect x="216" y="56" width="168" height="140" fill="#FFE14D" stroke="#1A1A1A" stroke-width="3"/>
  <text x="230" y="100" class="sans" fill="#1A1A1A" font-size="26" font-weight="900" letter-spacing="-1">BOLD.</text>
  <text x="230" y="124" class="sans" fill="#1A1A1A" font-size="26" font-weight="900" letter-spacing="-1">LOUD.</text>
  <rect x="235" y="155" width="96" height="30" fill="#1A1A1A"/>
  <g class="press">
    <rect x="230" y="150" width="96" height="30" fill="#FF5C8A" stroke="#1A1A1A" stroke-width="3"/>
    <text x="278" y="170" text-anchor="middle" class="sans" fill="#1A1A1A" font-size="11" font-weight="900" letter-spacing="1">CLICK!</text>
  </g>
  <text x="376" y="188" text-anchor="end" class="mono" fill="#1A1A1A" font-size="9">brutal</text>

  <!-- Glass -->
  <g clip-path="url(#g3)">
    <rect x="408" y="56" width="168" height="140" fill="#2B1E5C"/>
    <g filter="url(#soft)">
      <circle class="blob" cx="440" cy="90" r="42" fill="#7F5AF0"/>
      <circle class="blob blob2" cx="540" cy="170" r="46" fill="#2CB1BC"/>
      <circle class="blob" cx="560" cy="80" r="26" fill="#FF8FAB"/>
    </g>
    <rect x="424" y="78" width="136" height="96" rx="14" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".45"/>
    <rect x="438" y="94" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity=".75"/>
    <rect x="438" y="110" width="104" height="6" rx="3" fill="#FFFFFF" fill-opacity=".4"/>
    <rect x="438" y="140" width="80" height="22" rx="11" fill="#FFFFFF" fill-opacity=".28" stroke="#FFFFFF" stroke-opacity=".6"/>
    <text x="478" y="155" text-anchor="middle" class="sans" fill="#FFFFFF" font-size="10" font-weight="600">Button</text>
  </g>
  <text x="566" y="188" text-anchor="end" class="mono" fill="#E9E4FF" font-size="9">glass</text>

  <text x="24" y="238" class="sans" fill="#1A1A1A" font-size="19" font-weight="700">Three visual languages. One framework.</text>
</svg>
