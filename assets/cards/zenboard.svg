<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ZenBoard / OnTrackTab — a calmer place to start.</title>
  <desc id="desc">Animated illustration: a quiet new tab with a ticking clock, a search bar with a blinking caret, a drifting weather cloud and softly breathing widgets.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace}
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .cloud{animation:cloud 8s ease-in-out infinite alternate}
    @keyframes cloud{from{transform:translateX(-6px)}to{transform:translateX(10px)}}
    .br{animation:br 6s ease-in-out infinite}
    .br2{animation-delay:-2s}.br3{animation-delay:-4s}
    @keyframes br{0%,100%{opacity:.75}50%{opacity:1}}
    .tick{animation:tick 2.4s ease-in-out infinite}
    .tick2{animation-delay:-.8s}.tick3{animation-delay:-1.6s}
    @keyframes tick{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1A2C"/><stop offset="1" stop-color="#16223F"/>
    </linearGradient>
    <radialGradient id="zglow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 118) scale(110)">
      <stop stop-color="#7DD3FC" stop-opacity=".22"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="260" rx="14" fill="url(#zbg)"/>
  <rect width="600" height="260" rx="14" fill="url(#zglow)"/>
  <rect x=".5" y=".5" width="599" height="259" rx="13.5" stroke="#26365A"/>
  <text x="24" y="32" class="sans" fill="#7DD3FC" font-size="11" font-weight="700" letter-spacing="2">07 / BROWSER EXTENSION · REACT · TYPESCRIPT</text>

  <!-- clock -->
  <g transform="translate(110 120)">
    <circle r="62" fill="#111F36" stroke="#2C4370" stroke-width="2"/>
    <g stroke="#4B6496" stroke-width="2" stroke-linecap="round">
      <path d="M0-54v8M0 54v-8M54 0h-8M-54 0h8"/>
    </g>
    <path d="M0 0V-30" stroke="#E6EEFF" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="240s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0V-44" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M0 8V-50" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0;6;12;18;24;30;36;42;48;54;60;66;72;78;84;90;96;102;108;114;120;126;132;138;144;150;156;162;168;174;180;186;192;198;204;210;216;222;228;234;240;246;252;258;264;270;276;282;288;294;300;306;312;318;324;330;336;342;348;354;360" calcMode="discrete" dur="60s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#7DD3FC"/>
  </g>

  <!-- search -->
  <rect x="210" y="58" width="366" height="40" rx="20" fill="#13223D" stroke="#2C4370"/>
  <circle cx="234" cy="77" r="6" stroke="#7DD3FC" stroke-width="2"/><path d="m239 82 5 5" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="82" class="sans" fill="#8FA3C8" font-size="13">search bookmarks…</text>
  <rect class="caret" x="372" y="69" width="1.5" height="17" fill="#E6EEFF"/>

  <!-- widgets -->
  <g class="br">
    <rect x="210" y="112" width="112" height="84" rx="14" fill="#13223D" stroke="#2C4370"/>
    <g class="cloud">
      <circle cx="246" cy="146" r="13" fill="#FDE68A"/>
      <path d="M248 164h40a12 12 0 0 0 0-24 16 16 0 0 0-30-4 12 12 0 0 0-10 28z" fill="#E6EEFF"/>
    </g>
    <text x="226" y="186" class="mono" fill="#8FA3C8" font-size="10">weather</text>
  </g>
  <g class="br br2">
    <rect x="334" y="112" width="112" height="84" rx="14" fill="#13223D" stroke="#2C4370"/>
    <g stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" opacity=".85"><path d="M350 136h72M350 150h58M350 164h66"/></g>
    <text x="350" y="186" class="mono" fill="#8FA3C8" font-size="10">notes</text>
  </g>
  <g class="br br3">
    <rect x="458" y="112" width="118" height="84" rx="14" fill="#13223D" stroke="#2C4370"/>
    <g fill="#7DD3FC">
      <rect class="tick" x="474" y="130" width="24" height="24" rx="6"/>
      <rect class="tick tick2" x="504" y="130" width="24" height="24" rx="6" fill="#C4B5FD"/>
      <rect class="tick tick3" x="534" y="130" width="24" height="24" rx="6" fill="#FDE68A"/>
    </g>
    <text x="474" y="186" class="mono" fill="#8FA3C8" font-size="10">shortcuts</text>
  </g>

  <text x="24" y="238" class="sans" fill="#EEF4FF" font-size="19" font-weight="600">A calmer place to start.</text>
  <text x="576" y="238" text-anchor="end" class="mono" fill="#5D7299" font-size="10">settings stay local</text>
</svg>
